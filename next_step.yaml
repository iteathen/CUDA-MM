activation:
  gate_issue: 3
  consumer_assessment_issue: 4
  production_authorized: false
  rule: >-
    Production CUDA-MM requires either two materially different consumers sharing one
    domain-neutral physical-memory policy contract or one exceptionally strong consumer
    whose abstraction survives deletion and ownership tests, followed by an accepted
    bounded production specification.

constraints:
  - CUDA-JS is the sole native CUDA/provider owner.
  - Semantic consumers retain logical resource meaning and liveness.
  - CUDA-MM remains JavaScript/TypeScript plus separately accepted restricted Device-JS only.
  - No Python, C/C++, CUDA C++, hand PTX, native FFI/addons, CUDA ABI/header ownership or private lower imports.
  - Existing CUDA-JS pinned/registered-host, managed-memory and P2P issues remain CUDA-JS-owned.
  - Do not migrate existing Tensor/MCGS/data planners merely because CUDA-MM now has an owner.
  - Repository creation, accepted ownership and provider availability are not production implementation authority.

sequence:
  - Execute issue #4 against current protected Tensor and CUDA-MCGS evidence.
  - Classify every candidate constraint/decision by natural owner and run deletion tests.
  - Feed the assessment into issue #3 and explicitly activate or park production CUDA-MM.
  - If activated, accept the smallest bounded semantic/profile specification before source/API work.
  - Keep issue #2 independent until repository settings are corrected and read back.

blocked_implementation:
  reason: >-
    Cross-domain physical-memory policy now has an accepted owner, but a production
    abstraction has not yet been demonstrated strongly enough to justify implementation.
